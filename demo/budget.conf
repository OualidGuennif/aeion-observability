# Spending bounds for paid factory work, in USD. Not secret; owner-editable.
# Code ceilings (demo/factory/budget.py) can only be lowered here, never raised:
#   DAILY_LIMIT_USD <= 15.00, AUTHOR_MAX_USD <= 5.00, REVIEW_MAX_USD <= 1.00,
#   and AUTHOR_MAX_USD + 2 * REVIEW_MAX_USD <= DAILY_LIMIT_USD; AUTHOR_TIMEOUT_MINUTES <= 180.
# An invalid file holds new builds as budget_config_invalid and admits no spending.
# An exported AEION_<KEY> overrides a line. A change applies to builds admitted afterwards;
# restart the cockpit to reload it.

# Per Europe/Paris day, for each repository purse (forum workers and the cockpit are separate).
DAILY_LIMIT_USD=15.00
# One author agent execution of one MD: reserved up front, the relay stops the session at it.
AUTHOR_MAX_USD=5.00
# One independent review vote (each build needs two).
REVIEW_MAX_USD=1.00
# One author agent execution's wall-clock window, whole minutes from 5 to 180 (default 30).
# AUTHOR_MAX_USD still stops the session first if the money runs out.
AUTHOR_TIMEOUT_MINUTES=180
