# Agora forum: Quarkus on Java 25, Hibernate over a SQLite database that is deployed separately.
# The database file is owned by the sqlite service (demo/forum-db); the application only opens it
# through a URL that keeps WAL and a busy timeout, never by copying it.

quarkus.application.name=agora-forum
aeion.release=${AEION_RELEASE:unreleased}
quarkus.http.port=${AEION_FORUM_PORT:8081}
quarkus.http.host=127.0.0.1

# --- Settings (feature 001) ----------------------------------------------------------------
# A deployment without a real secret refuses to start (SessionSecret names only the key).
# The value comes from the environment; it is never written to a file, a log or a page.
agora.session.secret=${AGORA_SESSION_SECRET:}
# Request body cap: a 16 KiB ceiling, refused as 413 before any handler runs.
quarkus.http.limits.max-body-size=16K

# --- SQLite ---------------------------------------------------------------------------------
quarkus.datasource.db-kind=other
quarkus.datasource.jdbc.driver=org.sqlite.JDBC
quarkus.datasource.username=
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:sqlite:${AEION_SQLITE_PATH:/tmp/agora.db}
quarkus.datasource.jdbc.max-size=8
quarkus.datasource.jdbc.acquisition-timeout=10s
# busy_timeout + WAL are set per connection by the driver URL parameters below.
quarkus.datasource.jdbc.additional-jdbc-properties.busy_timeout=5000
quarkus.datasource.jdbc.additional-jdbc-properties.journal_mode=WAL
quarkus.datasource.jdbc.additional-jdbc-properties.synchronous=NORMAL

quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.schema-management.strategy=none

# --- Migrations -----------------------------------------------------------------------------
# The migration runner is ours (feature 002): a versioned SQL folder, applied in order inside a
# transaction, recorded in schema_migrations. No Flyway module exists for SQLite, and owning the
# runner keeps the schema reproducible in a test with an ephemeral database.
aeion.migrations.location=db/migration

# --- Kafka (feature 011) --------------------------------------------------------------------
# Off by default: a deployment without a broker must still serve readers, and its events wait in the
# outbox. With AEION_KAFKA_ENABLED=true the publisher drains the outbox and the consumer subscribes;
# both use the plain clients, so no connector has to exist for a unit run.
agora.kafka.enabled=${AEION_KAFKA_ENABLED:false}
agora.kafka.bootstrap.servers=${AEION_KAFKA:127.0.0.1:9092}
agora.kafka.topic=agora.threads
agora.kafka.group=agora-forum

%test.quarkus.scheduler.enabled=false
# An ephemeral port keeps a suite from colliding with a forum a human is running.
%test.quarkus.http.test-port=0

quarkus.log.category."local.aeion".level=INFO
