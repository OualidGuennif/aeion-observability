# Optional: the pull-request review in GitHub instead of the local `pr-review` skill.
# Off until you add the repository secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`) and
# set the repository variable PR_REVIEW_IN_CI to "true".
name: PR review
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
permissions:
  contents: read
  pull-requests: write
  id-token: write  # claude-code-action's default GitHub App authentication uses OIDC
jobs:
  review:
    if: vars.PR_REVIEW_IN_CI == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Prepare mandatory architecture baseline
        run: tools/architecture/setup && tools/architecture/refresh --target HEAD
      - uses: anthropics/claude-code-action@a5a423f75c251dcbff8a74e99f83b2cb03c72bfa # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--max-turns 30'
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} following .claude/skills/pr-review/SKILL.md.
            Post exactly one comment starting with "Review: OK" or "Review: NOT OK". Do not merge.
