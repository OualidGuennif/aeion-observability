name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 examples/compare_cohorts.py
      - run: python3 -m unittest discover -s tests -v
      - name: Validate bundled synthetic fixtures
        run: python3 examples/validate_fixtures.py
      - name: Run host-level demo checks (bootstrap helpers and Docker-free units)
        run: python3 -m unittest discover -s demo/tests -v

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - name: Generate disposable local configuration without a provider key
        run: python3 demo/setup.py
      - name: Install the host-native controller (venv, pinned tokenizers, locked Flue harness)
        run: python3 demo/install.py
      - name: Bootstrap pinned OpenShell with NVIDIA telemetry disabled
        run: python3 demo/openshell/setup.py
      - name: Verify usage, KPIs, tokenizers, admission barrier and sandbox bridge
        run: demo/.local/venv/bin/python -m unittest discover -s demo/tests -v
      - name: Verify the Flue observer, provider and sandbox adapter contracts
        working-directory: demo/flue
        run: npm test
      - name: Verify four protected task contracts inside OpenShell
        run: demo/.local/venv/bin/python demo/tests/qualify_scenarios.py
      - name: Qualify the real Flue harness on all three tiers using local fake inference only
        run: demo/.local/venv/bin/python demo/tests/qualify_flue.py
      - name: Stop the private OpenShell gateway
        if: always()
        run: if [ -f demo/.local/openshell/gateway.pid ]; then kill "$(cat demo/.local/openshell/gateway.pid)" || true; fi
