name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 examples/compare_cohorts.py
      - run: python3 -m unittest discover -s tests -v
      - name: Validate bundled synthetic fixtures
        run: python3 examples/validate_fixtures.py
