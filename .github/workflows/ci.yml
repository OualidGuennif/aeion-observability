name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  offline-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 examples/compare_cohorts.py
      - run: python3 -m unittest discover -s tests -v
      - name: Validate bundled synthetic fixtures
        run: python3 examples/validate_fixtures.py

  docker-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Generate disposable local configuration without a provider key
        run: python3 demo/setup.py
      - name: Build pinned demo runtime
        run: docker compose --env-file demo/.local/stack.env -f demo/compose.yaml build demo
      - name: Verify native usage, KPIs, tokenizers and admission limits
        run: docker compose --env-file demo/.local/stack.env -f demo/compose.yaml run --rm --no-deps demo python3 -m unittest discover -s /opt/demo/tests -v
      - name: Verify pre-dispatch Markdown and context gates
        run: docker compose --env-file demo/.local/stack.env -f demo/compose.yaml run --rm --no-deps demo node --test /opt/demo/tests/gate.test.mjs
      - name: Qualify the real build CLI using local fake inference only
        run: docker compose --env-file demo/.local/stack.env -f demo/compose.yaml run --rm --no-deps demo python3 /opt/demo/tests/qualify_cli.py
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose --env-file demo/.local/stack.env -f demo/compose.yaml down --volumes --remove-orphans
